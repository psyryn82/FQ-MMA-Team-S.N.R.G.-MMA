# Stripe sends signed webhook requests without Supabase user JWTs.
# The handler verifies the Stripe-Signature header against STRIPE_WEBHOOK_SECRET.
[functions.stripe-webhook]
verify_jwt = false

# Checkout must only be called with an authenticated Supabase user JWT.
[functions.create-checkout-session]
verify_jwt = true

# Private media delivery uses one-time tokens for recipients and verifies staff JWTs for admin actions.
[functions.create-protected-media-url]
verify_jwt = false

# These endpoints intentionally implement their own checks (public API key, origin,
# Stripe payment verification, and server-side purchase-ledger authorization).
[functions.list-available-streams]
verify_jwt = false

[functions.create-stream-checkout]
verify_jwt = false

[functions.create-stream-playback]
verify_jwt = false

[functions.create-ticket-checkout]
verify_jwt = false

# Paid VOD playback verifies Stripe payment and the purchase ledger server-side.
[functions.create-protected-media-playback]
verify_jwt = false

# Public media checkout is rate-limited and validates every item and price server-side.
[functions.create-media-checkout]
verify_jwt = false
# Public forms verify Cloudflare Turnstile server-side before accepting submissions.
[functions.send-contact-message]
verify_jwt = false

[functions.create-booking-request]
verify_jwt = false
