name: Static site syntax checks
on:
  pull_request:
  push:
    branches:
      - main
      - fix/supabase-admin-complete
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check inline browser JavaScript
        run: python3 scripts/check-inline-js.py
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/create-checkout-session/index.ts supabase/functions/stripe-webhook/index.ts
