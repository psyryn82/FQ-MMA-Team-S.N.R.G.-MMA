<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Secure Video | FQ MMA</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#09090b;color:#fafafa;font-family:system-ui,sans-serif}.panel{background:#18181b;border:1px solid #3f3f46;border-radius:1rem}.accent{color:#ef4444}</style></head>
<body><main class="max-w-4xl mx-auto px-5 py-10"><a href="/" class="text-sm underline">FQ MMA / Team S.N.R.G.</a><section class="panel p-5 sm:p-8 mt-6"><p class="accent text-xs font-bold uppercase tracking-widest">Private access</p><h1 id="title" class="text-2xl sm:text-3xl font-black mt-2">Secure video</h1><p id="status" class="text-zinc-300 mt-3" role="status">Checking your private link…</p><video id="player" class="w-full mt-5 rounded-lg bg-black hidden" controls playsinline controlslist="nodownload noplaybackrate" disablepictureinpicture></video><p class="text-zinc-400 text-xs mt-4">The temporary playback link expires. Please do not share it. Screen recording cannot be fully prevented.</p></section></main>
<script>
(async function(){
 const status=document.getElementById("status"),player=document.getElementById("player"),title=document.getElementById("title");
 const match=location.hash.match(/token=([0-9a-f]{64})/i);
 if(!match){status.textContent="This private video link is missing or invalid. Ask staff or Sasha to send a new link.";return;}
 const token=match[1];history.replaceState(null,"",location.pathname+location.search);
 try{
  const response=await fetch("https://dmcbbavsxyxrxuuzraiu.supabase.co/functions/v1/create-protected-media-url",{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_vJAptJ41TpicuxtMsp8tA_AaMFlGEC"},body:JSON.stringify({action:"playback",token})});
  const result=await response.json();if(!response.ok||!result.url)throw new Error(result.error||"This video link is invalid or expired.");
  title.textContent=result.title||"Secure video";player.src=result.url;player.classList.remove("hidden");status.textContent="Your video is ready to watch.";
  player.addEventListener("error",()=>{status.textContent="Playback failed or the temporary link expired. Ask staff or Sasha for a fresh link.";});
 }catch(error){status.textContent=error.message||"Unable to verify this video link. Ask staff or Sasha for help.";}
})();
</script></body></html>
