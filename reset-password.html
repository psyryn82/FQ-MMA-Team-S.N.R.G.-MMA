<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset administrator password · FQ MMA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark}body{background:#07080a;color:#e5e7eb;font-family:Inter,sans-serif}.head{font-family:Oswald,sans-serif}.panel{background:#111318;border:1px solid #292d35;border-radius:14px}.field{width:100%;padding:11px 12px;background:#08090c;border:1px solid #343945;border-radius:8px;color:#fff;margin-top:5px}.btn{background:#e50914;color:white;font-weight:700;padding:10px 14px;border-radius:8px}.muted{color:#9ca3af}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
<main class="panel p-6 w-full max-w-md">
<div class="head text-3xl uppercase font-bold"><span class="text-red-500">FQ MMA</span> Password reset</div>
<p class="muted text-sm mt-2 mb-6">Choose a new password for your administrator account. This page is only for a password-reset link sent by FQ MMA.</p>
<div id="status" class="text-sm mb-4" role="status" aria-live="polite">Checking your secure reset link…</div>
<form id="resetForm" class="space-y-4 hidden">
<label class="block text-sm">New password<input id="newPassword" class="field" type="password" autocomplete="new-password" minlength="10" required><span class="muted text-xs">Use at least 10 characters.</span></label>
<label class="block text-sm">Confirm new password<input id="confirmPassword" class="field" type="password" autocomplete="new-password" minlength="10" required></label>
<button id="saveBtn" class="btn w-full" type="submit">Save new password</button>
</form>
<a id="backLink" class="inline-block mt-5 text-sm text-red-300 underline" href="./admin.html">Return to administrator sign in</a>
</main>
<script>
const CONFIG={supabaseUrl:'https://dmcbbavsxyxrxuuzraiu.supabase.co',supabaseKey:'sb_publishable_vJAptJ41TpicuxtMspB8tA_AaMFlGEC'};
const client=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const statusEl=document.getElementById('status'),form=document.getElementById('resetForm'),saveBtn=document.getElementById('saveBtn');
function status(message,error=false){statusEl.textContent=message;statusEl.className='text-sm mb-4 '+(error?'text-red-400':'text-gray-300')}
let recoveryReady=false;
async function initialize(){
 const params=new URLSearchParams(window.location.search);
 if(params.get('error_description')){status('This reset link is invalid or expired. Request a new one from the admin sign-in page.',true);return}
 const {data,error}=await client.auth.getSession();
 if(error){status('Could not validate the reset session. Request a new reset email and open the newest link.',true);return}
 if(data.session){recoveryReady=true;form.classList.remove('hidden');status('Reset link verified. Enter your new password.');return}
 status('This reset link is missing its recovery session or has expired. Request a new reset email from the admin sign-in page.',true);
}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 if(!recoveryReady){status('Your reset session is not valid. Request a new reset link.',true);return}
 const password=document.getElementById('newPassword').value,confirmPassword=document.getElementById('confirmPassword').value;
 if(password.length<10){status('Use a password with at least 10 characters.',true);return}
 if(password!==confirmPassword){status('The passwords do not match.',true);return}
 saveBtn.disabled=true;saveBtn.textContent='Saving…';
 const {error}=await client.auth.updateUser({password});
 if(error){status('Could not update password: '+error.message,true);saveBtn.disabled=false;saveBtn.textContent='Save new password';return}
 recoveryReady=false;form.classList.add('hidden');
 status('Password updated. Return to administrator sign in and sign in with your email and new password.');
 await client.auth.signOut();
});
initialize();
</script>
</body>
</html>
