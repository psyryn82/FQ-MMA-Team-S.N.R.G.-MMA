<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FQ MMA | Secure Live Stream</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{color-scheme:dark;--bg:#07080a;--panel:#111318;--line:#2d3643;--text:#edf2f7;--muted:#a0a8b7;--accent:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1a202b 0,#07080a 48%);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,1000px)}.brand{font-size:.8rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(1.8rem,5vw,3rem);text-transform:uppercase;margin:.6rem 0}p{color:var(--muted);line-height:1.6}.panel{background:rgba(17,19,24,.94);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,34px);box-shadow:0 24px 60px #0008}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;margin-top:18px;overflow:hidden}.player video{display:block;width:100%;height:100%;border:0;background:#000}.message{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#07080a}.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:800;margin-top:14px}
</style>
</head>
<body>
<main>
  <p class="brand">FQ MMA / Team S.N.R.G.</p>
  <section class="panel">
    <h1 id="eventTitle">Secure live stream</h1>
    <p>This page verifies your Stripe payment before requesting a short-lived signed playback token. Please do not share your checkout link.</p>
    <p id="streamMessage" class="message" role="status">Verifying your purchase…</p>
    <div id="playerWrap" class="player" hidden><video id="hlsPlayer" controls playsinline hidden></video></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <a class="btn" href="./index.html">Back to FQ MMA</a>
  </section>
</main>
<script>
const SUPABASE_URL = "https://dmcbbavsxyxrxuuzraiu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vJAptJ41TpicuxtMspB8tA_AaMFlGEC";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: false } });
const message = document.getElementById("streamMessage");
const playerWrap = document.getElementById("playerWrap");
const hlsPlayer = document.getElementById("hlsPlayer");
let hlsInstance = null;
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");
const freeEventId = params.get("free_event_id");
async function startPlayback() {
  const freeMode = Boolean(freeEventId);
  if (freeMode && !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(freeEventId)) {
    message.textContent = "The free stream link is invalid.";
    return;
  }
  if (!freeMode && (!sessionId || !/^cs_(test|live)_[A-Za-z0-9_]+$/.test(sessionId))) {
    message.textContent = "A valid completed checkout link is required. If you paid, use the link from your checkout confirmation.";
    return;
  }
  try {
    const { data, error } = freeMode
      ? await client.functions.invoke("create-free-stream-playback", { body: { event_id: freeEventId } })
      : await client.functions.invoke("create-livepeer-stream-playback", { body: { session_id: sessionId } });
    if (error) throw error;
    if (!data?.playback_url) throw new Error(data?.error || "Secure playback is not available yet.");
    document.getElementById("eventTitle").textContent = data.event_title || "FQ MMA Live Stream";
    playerWrap.hidden = false;
    if (/^https:\/\/playback\.livepeer\.studio\/hls\/[A-Za-z0-9_-]{8,128}\/index\.m3u8\?jwt=[A-Za-z0-9._~-]+$/i.test(data.playback_url)) {
      hlsPlayer.hidden = false;
      if (hlsPlayer.canPlayType("application/vnd.apple.mpegurl")) {
        hlsPlayer.src = data.playback_url;
      } else if (window.Hls && Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(data.playback_url);
        hlsInstance.attachMedia(hlsPlayer);
        hlsInstance.on(Hls.Events.ERROR, (_event, info) => {
          if (info.fatal) message.textContent = "The stream could not start. Please refresh and try again.";
        });
      } else {
        throw new Error("This browser cannot play the secure stream. Try Safari or a current Chrome browser.");
      }
    } else {
      throw new Error("The Livepeer playback address was not recognized as a secure stream.");
    }
    message.textContent = freeMode ? "Free stream access confirmed. Press play when you are ready." : "Payment verified. Press play when you are ready.";
  } catch (error) {
    message.textContent = error?.message || "Secure playback could not be started. If you just paid, wait a moment and refresh.";
  }
}
startPlayback();
</script>
</body>
</html>
